schema_version: "1.0"
category: order
intent: cancel_order
policy_doc_names:
  - 07_order_cancellation_policy
source_query: order cancel_order policy
auto_resolvable: true
requires_evidence: true
default_ineligible_reason: The order status is currently shipped, delivered, or already cancelled.
time_limits:
  order_age_hours_max: 24
eligibility_rules:
  - id: order_must_exist
    description: Order must exist before cancellation workflow.
    field: order_found
    op: eq
    value: true
    failure_reason: We could not find that order in our system.
    applies_to: runtime
  - id: order_not_delivered
    description: Delivered orders cannot be cancelled.
    field: order_status
    op: neq
    value: delivered
    failure_reason: Delivered orders cannot be cancelled.
    applies_to: runtime
  - id: order_within_time_limit
    description: Cancellation must be within the allowed time window.
    field: order_age_hours
    op: lte
    value_from: policy.time_limits.order_age_hours_max
    failure_reason: Cancellation window has expired.
    applies_to: runtime
required_conditions: []
escalation_conditions: []
response_guidance:
  - If the order meets all eligibility criteria, initiate the cancellation request.
  - If the order fails eligibility rules, inform the customer clearly stating why the cancellation cannot be processed.
metadata:
  policy_focus: Order Status & Refund Handling
  artifact: order/cancel_order
