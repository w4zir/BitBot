id: contact_human_agent
category: contact
intent: contact_human_agent
policy_required: true
keywords:
  - human agent
  - talk to agent
  - live support
required_data:
  - name: reason
    prompt: Please briefly describe what you need help with.
steps:
  - id: create_handoff
    type: tool_call
    tool: create_contact_handoff
  - id: check_policy_constraints
    type: policy_check
    policy_phase: runtime
    on_true: branch_handoff_created
    on_false: handoff_failed
  - id: branch_handoff_created
    type: logic_gate
    condition:
      {
        op: eq,
        field: handoff_created,
        value: true,
        failure_reason: A human agent handoff ticket could not be created.
      }
    on_true: handoff_confirmed
    on_false: handoff_failed
  - id: handoff_confirmed
    type: llm_response
    message: >
      Confirm a human handoff ticket has been created and share handoff_ticket_id.
  - id: handoff_failed
    type: llm_response
    message: >
      Handoff ticket creation failed. Ask the user to retry.
expected_outcomes:
  - id: handoff_outcome_present
    field: handoff_created
    op: exists
    failure_reason: Handoff creation outcome missing.
fallback_response: I can connect you to a human agent once you share the reason.
