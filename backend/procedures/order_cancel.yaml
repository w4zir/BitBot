id: order_cancel
category: order
intent: cancel_order
policy_required: true
keywords:
  - cancel
  - do not want
  - dont want
required_data:
  - name: order_id
    prompt: Please provide your order number (e.g. ORD-12345).
# Order ID is validated before steps run — if missing, the user is asked for their order ID; if present, continue below.
steps:
  - id: lookup_order
    type: tool_call
    tool: check_order_status
  - id: check_policy_constraints
    type: policy_check
    policy_phase: runtime
    policy_rules:
      - order_must_exist
      - order_not_delivered
      - order_within_time_limit
    on_true: branch_order_found
    on_false: cancellation_not_allowed
  - id: branch_order_found
    type: logic_gate
    condition:
      {
        op: eq,
        field: order_found,
        value: true,
        failure_reason: We could not find that order in our system.
      }
    on_true: branch_order_not_delivered
    on_false: order_not_found
  - id: branch_order_not_delivered
    type: logic_gate
    condition: {op: neq, field: order_status, value: delivered, failure_reason: Delivered orders cannot be cancelled.}
    on_true: branch_order_within_cancel_window
    on_false: cancellation_not_allowed
  - id: branch_order_within_cancel_window
    type: logic_gate
    condition:
      {op: lte, field: order_age_hours, value_from: policy.time_limits.order_age_hours_max, failure_reason: Cancellation window has expired.}
    on_true: apply_policy_and_cancel_or_decline
    on_false: cancellation_not_allowed
  - id: order_not_found
    type: llm_response
    message: >
      The order was not found (order_found is false). Tell the customer we could not find this
      order in our system, and ask them to validate their order ID and try again.
  - id: apply_policy_and_cancel_or_decline
    type: tool_call
    tool: cancel_order
  - id: branch_cancel_succeeded
    type: logic_gate
    condition:
      {
        op: eq,
        field: cancel_succeeded,
        value: true,
        failure_reason: Cancellation could not be completed for this order.
      }
    on_true: confirm_cancelled
    on_false: cancellation_not_allowed
  - id: confirm_cancelled
    type: llm_response
    message: >
      The cancellation was executed by the backend tool (cancel_succeeded is true). Confirm to
      the customer that order_id_extracted has been cancelled and share what they should expect
      next.
  - id: cancellation_not_allowed
    type: llm_response
    message: >
      The cancellation could not be executed (cancel_succeeded is false). Explain clearly why
      using cancel_reason from procedure context and guide the customer on next steps.
expected_outcomes:
  - id: cancel_outcome_present
    field: cancel_succeeded
    op: exists
    failure_reason: Missing cancellation outcome in context.
fallback_response: I can help with cancellation once you share your order number so I can verify it.
