id: complaint
category: feedback
intent: complaint
policy_required: true
keywords:
  - complaint
  - bad experience
  - unhappy
required_data:
  - name: feedback
    prompt: Please share your complaint details.
steps:
  - id: create_complaint
    type: tool_call
    tool: create_complaint_ticket
  - id: branch_complaint_created
    type: logic_gate
    condition:
      {
        op: eq,
        field: complaint_created,
        value: true,
        failure_reason: A complaint ticket could not be created.
      }
    on_true: complaint_confirmed
    on_false: complaint_failed
  - id: complaint_confirmed
    type: llm_response
    message: >
      Confirm complaint has been logged and share complaint_ticket_id with expected next steps.
  - id: complaint_failed
    type: llm_response
    message: >
      Complaint logging failed. Ask the user to retry and apologize.
expected_outcomes:
  - id: complaint_outcome_present
    field: complaint_created
    op: exists
    failure_reason: Complaint creation outcome missing.
fallback_response: I can log your complaint once you share the details.
