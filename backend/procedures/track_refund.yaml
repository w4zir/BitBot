id: track_refund
category: refund
intent: track_refund
policy_required: true
keywords:
  - track refund
  - refund status
  - where is my refund
required_data:
  - name: order_id
    prompt: Please share your order number (for example ORD-12345).
steps:
  - id: lookup_refund_status
    type: tool_call
    tool: payment_refund_status
  - id: branch_refund_tracking_found
    type: logic_gate
    condition: {op: eq, field: refund_tracking_found, value: true}
    on_true: share_refund_status
    on_false: refund_tracking_not_found
  - id: share_refund_status
    type: llm_response
    message: >
      Share refund status using refund_decision and refund_decision_reason.
  - id: refund_tracking_not_found
    type: llm_response
    message: >
      Refund tracking details were not found for this order. Ask the user to verify the
      order number.
expected_outcomes:
  - id: refund_tracking_outcome_present
    field: refund_tracking_found
    op: exists
    failure_reason: Missing refund tracking outcome.
fallback_response: I can track your refund once you share the order number.
