id: product_info
category: product
intent: product_info
policy_required: true
keywords:
  - product info
  - product details
  - description
  - company
required_data:
  - name: product_name
    prompt: Which product would you like details for?
steps:
  - id: lookup_product_info
    type: tool_call
    tool: product_info_lookup
  - id: check_policy_constraints
    type: policy_check
    policy_phase: runtime
    on_true: share_product_info
    on_false: product_not_found
  - id: share_product_info
    type: llm_response
    message: >
      The product was found. Share only product name, company, and description from product_info.
  - id: product_not_found
    type: llm_response
    message: >
      The product was not found. Ask the user to confirm the product name.
expected_outcomes:
  - id: product_info_lookup_outcome_present
    field: product_found
    op: exists
    failure_reason: Missing product lookup outcome.
fallback_response: Tell me the product name and I will share the details.
