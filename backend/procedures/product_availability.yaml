id: product_availability
category: product
intent: product_availability
policy_required: true
keywords:
  - availability
  - in stock
  - out of stock
required_data:
  - name: product_name
    prompt: Which product availability would you like to check?
steps:
  - id: lookup_product_availability
    type: tool_call
    tool: product_availability_lookup
  - id: check_policy_constraints
    type: policy_check
    policy_phase: runtime
    policy_rules:
      - product_must_exist
    on_true: branch_product_found
    on_false: product_not_found
  - id: branch_product_found
    type: logic_gate
    condition:
      {
        op: eq,
        field: product_found,
        value: true,
        failure_reason: We could not find that product in our catalog.
      }
    on_true: share_availability
    on_false: product_not_found
  - id: share_availability
    type: llm_response
    message: >
      The product was found. Answer only whether the product is available based on
      product_availability.is_available.
  - id: product_not_found
    type: llm_response
    message: >
      The product was not found. Ask the user to confirm the product name.
expected_outcomes:
  - id: product_availability_lookup_outcome_present
    field: product_found
    op: exists
    failure_reason: Missing product availability lookup outcome.
fallback_response: Share the product name and I can check if it is available.
